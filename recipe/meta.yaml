{% set name = "roboticstoolbox-python" %}
{% set version = "1.4.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b387f541eff07f5a8dbadd20f4dcdd8d4031e49a82534e821281bfc306026d65
build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja
    - make  # [linux]
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
  host:
    - pip
    - python
    - numpy
    - scikit-build-core
    - setuptools
    - nanobind
  run:
    - ansitable
    - matplotlib-base
    - numpy >=1.18.0
    - pgraph-python
    - python
    - qpsolvers
    - rtb-data
    - scipy
    - spatialgeometry >=1.0.0
    - spatialmath-python >=1.1.16
    - swift-sim >=1.0.0
    - sympy
    - bullet >=3.21
    - imageio
    - imageio-ffmpeg
    - vpython
    - numpy-stl
    - pyyaml
    - progress
    - cryptography
    - colored >2.0.0
    - jupyter
    - xacrodoc
    - robot_descriptions

test:
  imports:
    - roboticstoolbox
    - roboticstoolbox.backends
  commands:
    - pip check
    - python -c "import roboticstoolbox as rtb; robot = rtb.models.Panda()"
  requires:
    - pip

about:
  home: https://github.com/petercorke/robotics-toolbox-python
  summary: A Python library for robotic education and research
  dev_url: https://github.com/petercorke/roboticstoolbox-python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
